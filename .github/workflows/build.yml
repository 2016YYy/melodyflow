name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      # app/build.gradle.kts 里 ndkVersion = flutter.ndkVersion（Flutter 3.44.9 对应
      # 27.0.12077973）。runner 镜像不保证预装该版本，缺失时 AGP 在配置 :app 阶段直接报
      # "NDK not configured. Download it with SDK manager. Preferred NDK version is '27.0.12077973'."
      # 因此这里显式安装，保证构建环境自足。
      - name: Install Android NDK
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          # app/build.gradle.kts 里 ndkVersion = flutter.ndkVersion，而 Flutter 各版本
          # 声明的 NDK 版本并不相同（FlutterExtension.ndkVersion）。硬编码单一版本可能装的
          # 不是 AGP 真正去 $SDK/ndk/<version> 里找的那个版本，所以直接从 Flutter SDK 源码里
          # 读出来，再和 AGP 8.9 的默认值一起保证安装。
          FLUTTER_NDK="$(grep -rhoE 'ndkVersion[^=]{0,40}= *"[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "Flutter 声明的 NDK 版本 = ${FLUTTER_NDK:-<未探测到>}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for c in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
          fi
          if [ -z "$SDKMGR" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "using sdkmanager: $SDKMGR"
          for V in "$FLUTTER_NDK" "27.0.12077973"; do
            [ -z "$V" ] && continue
            if [ -f "$SDK_ROOT/ndk/$V/source.properties" ]; then
              echo "NDK $V 已存在且已注册，跳过"
              continue
            fi
            # 目录存在但没有 source.properties 说明上次安装不完整，AGP 不会认它
            rm -rf "$SDK_ROOT/ndk/$V" 2>/dev/null || true
            echo "=== 安装 NDK $V ==="
            # yes 在被管道关闭时会收到 SIGPIPE，其退出码不可依赖；最终以目录是否存在为准
            yes 2>/dev/null | "$SDKMGR" --sdk_root="$SDK_ROOT" --install "ndk;$V" > "/tmp/ndk-install-$V.log" 2>&1 || true
            tail -4 "/tmp/ndk-install-$V.log" || true
            if [ -f "$SDK_ROOT/ndk/$V/source.properties" ]; then
              echo "NDK ready: $SDK_ROOT/ndk/$V"
            else
              echo "WARN: NDK $V 安装失败"
              tail -20 "/tmp/ndk-install-$V.log" || true
            fi
          done
          echo "=== 最终 NDK 目录 ==="
          ls -la "$SDK_ROOT/ndk" || true
          echo "=== 注册状态检查（AGP 只认带 source.properties 的 NDK 目录）==="
          for d in "$SDK_ROOT"/ndk/*/; do
            v="$(basename "$d")"
            if [ -f "$d/source.properties" ]; then
              echo "  OK   $v -> $(grep -E '^Pkg.Revision' "$d/source.properties" | head -1)"
            else
              echo "  BAD  $v 缺少 source.properties（AGP 会视为未安装）"
            fi
          done
          CHOSEN=""
          for cand in "$FLUTTER_NDK" "27.0.12077973" "27.3.13750724"; do
            [ -z "$cand" ] && continue
            if [ -f "$SDK_ROOT/ndk/$cand/source.properties" ]; then CHOSEN="$cand"; break; fi
          done
          if [ -z "$CHOSEN" ]; then
            for d in "$SDK_ROOT"/ndk/*/; do
              if [ -f "$d/source.properties" ]; then CHOSEN="$(basename "$d")"; break; fi
            done
          fi
          if [ -z "$CHOSEN" ]; then
            echo "ERROR: SDK 下没有任何已注册的 NDK"
            exit 1
          fi
          echo "选用 NDK 版本: $CHOSEN"
          echo "MELODYFLOW_NDK_VERSION=$CHOSEN" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "resolved SDK_ROOT=$SDK_ROOT"
          # 显式锁定 Android SDK，避免 flutter 自行探测到别的 SDK 目录后，
          # 把错误的 sdk.dir 写进 android/local.properties，导致 AGP 在该 SDK 下找不到 NDK。
          flutter config --android-sdk "$SDK_ROOT" || true
          flutter pub get
          echo "=== android/local.properties（flutter 写入的 sdk.dir 决定 AGP 去哪找 NDK）==="
          cat android/local.properties || true

      - name: Clear gradle caches
        run: |
          rm -rf ~/.gradle/caches/modules-2 || true
          rm -rf ~/.gradle/caches/jars-* || true
          ls ~/.gradle/caches 2>/dev/null || echo "no gradle caches"

      - name: Patch flutter_tools (repositories only, keep kotlin-dsl)
        run: |
          set -e
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          BG="$FLUTTER_DIR/packages/flutter_tools/gradle/build.gradle.kts"
          echo "flutter_tools build file: $BG"
          cp "$BG" /tmp/build.gradle.kts.orig

          # 重要：这里【不再】删除 `kotlin-dsl` 声明。
          # 历史版本曾因"included build 无法解析 kotlin-dsl"而删掉该行，
          # 但那是因为 android/gradle.properties 里的本地代理(127.0.0.1:18080)
          # 导致插件无法下载。代理问题已修复，kotlin-dsl 可正常解析；
          # 而 kotlin-dsl 正是提供 Gradle Kotlin DSL API
          # (extra / doLast / dependsOn / repositories / matchingFallbacks ...)
          # 的插件，删除它会导致 flutter_tools 插件编译报大量
          # "Unresolved reference" 错误。

          echo "=== plugins block (保持原样，不做任何删除) ==="
          sed -n '1,15p' "$BG"
          echo "=== 确认 kotlin-dsl 仍在 ==="
          grep -n 'kotlin-dsl' "$BG" || { echo "ERROR: kotlin-dsl 缺失，终止构建"; exit 1; }

          # included build 缺少 pluginManagement，默认仅 gradlePluginPortal；
          # 显式加入 Maven Central 与 Google（kotlin-dsl / kotlin jvm marker 所在仓库）
          SG="$FLUTTER_DIR/packages/flutter_tools/gradle/settings.gradle.kts"
          echo "=== original settings.gradle.kts ==="
          cat "$SG"
          {
            echo 'pluginManagement {'
            echo '    repositories {'
            echo '        gradlePluginPortal()'
            echo '        mavenCentral()'
            echo '        google()'
            echo '    }'
            echo '}'
            echo 'dependencyResolutionManagement {'
            echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)'
            echo '    repositories {'
            echo '        google()'
            echo '        mavenCentral()'
            echo '    }'
            echo '}'
          } > "$SG"
          echo "=== patched settings.gradle.kts ==="
          cat "$SG"


      - name: Pre-build flutter_tools gradle plugin (root build)
        run: |
          set +e
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          PLUGIN_DIR="$FLUTTER_DIR/packages/flutter_tools/gradle"
          cd "$PLUGIN_DIR"
          echo "=== building flutter_tools gradle plugin as ROOT build with system gradle ==="
          # 关键：把完整输出落盘再提取错误，不要用 tail -40 截断
          #（历史上 tail -40 把真正的 Kotlin 编译错误切掉了，导致根因长期不可见）
          gradle build --no-daemon --stacktrace > /tmp/prebuild.log 2>&1
          PREBUILD_EXIT=$?
          echo "PREBUILD_EXIT=$PREBUILD_EXIT"
          if [ $PREBUILD_EXIT -ne 0 ]; then
            echo "=== prebuild 失败：错误摘要 ==="
            grep -E "^e: |error:|Compilation error|What went wrong|Could not|Caused by:" /tmp/prebuild.log | head -30
            echo "=== prebuild 失败：编译错误上下文 ==="
            grep -B2 -A6 "^e: " /tmp/prebuild.log | head -40
            echo "=== prebuild 失败：仓库解析线索 ==="
            grep -iE "Could not resolve plugin|Plugin .* was not found|Resource missing|dl\.google\.com" /tmp/prebuild.log | head -20
          fi
          echo "=== build outputs ==="
          ls -la build/libs 2>/dev/null || echo "no build/libs"
          gradle --stop 2>&1 | tail -3 || true
          cd /

      - name: Diagnose network and java TLS
        run: |
          echo "=== java ==="
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== curl: Google Maven (AGP 所在仓库，最关键) ==="
          for u in \
            "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/8.9.1/com.android.application.gradle.plugin-8.9.1.pom" \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.1/gradle-8.9.1.pom" ; do
            echo "--- $u"
            curl -sSI --max-time 25 "$u" 2>&1 | head -4 || echo "CURL_FAILED: $u"
          done
          echo "=== curl: plugin portal / maven central ==="
          curl -sSI --max-time 20 https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom 2>&1 | head -4 || echo CURL_FAILED
          curl -sSI --max-time 20 https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.pom 2>&1 | head -4 || echo CURL_FAILED
          echo "=== java https probe ==="
          cat > /tmp/HttpsProbe.java <<'JAVAEOF'
          import java.net.*;
          import javax.net.ssl.*;
          public class HttpsProbe {
            public static void main(String[] args) {
              String[] urls = {
                "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.1/gradle-8.9.1.pom",
                "https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom",
                "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.pom"
              };
              for (String u : urls) {
                try {
                  HttpsURLConnection c = (HttpsURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(25000); c.setReadTimeout(25000);
                  System.out.println("JAVA_HTTPS " + c.getResponseCode() + " " + u);
                } catch (Exception e) {
                  System.out.println("JAVA_HTTPS_FAIL " + e.getClass().getSimpleName() + ": " + e.getMessage() + " " + u);
                }
              }
            }
          }
          JAVAEOF
          java /tmp/HttpsProbe.java 2>&1 || true
          echo "=== gradle version ==="
          cd android
          ./gradlew --version 2>&1 | grep -E "Gradle|JVM|Kotlin" || true
          echo "=== gradle 解析 AGP 的真实错误（--info 抓取，不截断关键行）==="
          ./gradlew help --info --stacktrace > /tmp/gradle-help.log 2>&1 || true
          grep -iE "Could not (resolve|GET|HEAD|download)|Resource missing|dl\.google\.com|Connection reset|timed out|SSL|UnknownHost|Could not resolve plugin" /tmp/gradle-help.log | head -30 || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/melodyflow-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Stop gradle daemons before build
        run: |
          cd android
          ./gradlew --stop 2>&1 | tail -3 || true
          pkill -f GradleDaemon 2>/dev/null || true
          rm -rf ~/.gradle/daemon || true
          cd ..

      - name: Configure Gradle network resilience
        run: |
          # GitHub runner 访问 Google Maven 偶发超时/连接重置，
          # 这里统一设置连接超时、读取超时与重试次数，避免单次网络抖动直接让整次构建失败。
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPEOF'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          systemProp.org.gradle.internal.http.retry.max=10
          org.gradle.daemon=true
          org.gradle.parallel=false
          org.gradle.caching=true
          PROPEOF
          echo "=== ~/.gradle/gradle.properties ==="
          cat ~/.gradle/gradle.properties
          # 预热 Google Maven 连通性：若此处失败说明 runner 到 Google Maven 不通，
          # 后续构建必然失败，直接给出明确结论而不是让 Gradle 报模糊的"plugin not found"
          echo "=== warm-up: Google Maven ==="
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/8.9.1/com.android.application.gradle.plugin-8.9.1.pom" || echo "000")
            echo "  attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "  Google Maven 可达"; break; fi
            sleep $((i*10))
          done

      - name: Diagnose NDK resolution
        run: |
          set +e
          echo "MELODYFLOW_NDK_VERSION=$MELODYFLOW_NDK_VERSION"
          echo "=== Flutter 侧 ndkVersion 声明 ==="
          grep -rn "ndkVersion" "$FLUTTER_ROOT/packages/flutter_tools/gradle/src" 2>/dev/null | head -10
          echo "=== SDK ndk 目录 ==="
          ls -la "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" 2>/dev/null
          echo "=== Flutter 模板 android/app/build.gradle.kts 里的 ndk 行 ==="
          grep -n "ndkVersion" android/app/build.gradle.kts || true
          echo "=== Gradle 配置 :app 的真实堆栈（grep NDK 相关帧）==="
          cd android
          ./gradlew help --stacktrace --no-daemon > /tmp/ndk-diag.log 2>&1
          grep -nE "NDK not configured|ndkVersion|NdkLocator|NdkHandler|Caused by|at com\.android" /tmp/ndk-diag.log | head -40
          echo "=== 若有 NDK 报错，输出其上下文 ==="
          grep -B3 -A25 "NDK not configured" /tmp/ndk-diag.log | head -60
          cd ..

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee /tmp/apk-build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== build failed: 完整错误上下文 ==="
            # 输出真实失败原因（Gradle 默认只给 'plugin not found' 这类模糊信息）
            grep -B5 -A20 "What went wrong" /tmp/apk-build.log | head -60
            echo "=== 网络类错误线索 ==="
            grep -iE "Could not (resolve|GET|HEAD|download)|Resource missing|dl\.google\.com|Connection reset|timed out|SSLHandshake|UnknownHost|No route to host" /tmp/apk-build.log | head -20 || true
            echo "=== 插件解析相关 ==="
            grep -iE "not found in any of the following sources|Searched in the following" /tmp/apk-build.log | head -10 || true
            echo "=== NDK / SDK 诊断 ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "--- android/local.properties ---"
            cat android/local.properties || true
            echo "--- ${ANDROID_HOME}/ndk ---"
            ls -la "${ANDROID_HOME}/ndk" 2>/dev/null || true
            echo "--- 已安装 NDK 的 source.properties ---"
            find "${ANDROID_HOME}" -maxdepth 3 -name source.properties 2>/dev/null | head -10 || true
            echo "--- app/build.gradle.kts 中 ndk 相关行 ---"
            grep -n "ndk" android/app/build.gradle.kts || true
          fi
          exit $STATUS
        env:
          KEYSTORE_PATH: melodyflow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=10

      - name: Calculate SHA-256
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk melodyflow-${VERSION}-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk.sha256 melodyflow-${VERSION}-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: melodyflow-*.apk*

  build-windows:
    name: Build Windows
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath melodyflow-${VERSION}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: melodyflow-*.zip

  build-ios:
    name: Build iOS IPA
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r melodyflow-${VERSION}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/melodyflow-*.ipa

  release:
    name: Create GitHub Release
    # 仅依赖实际启用的构建产物；windows/ios 当前以 `if: false` 临时禁用，不应阻塞发布
    needs: [build-android]
    # 发布动作只允许由 tag 推送触发：手动 workflow_dispatch 仅用于验证构建，
    # 防止一次验证运行就把半成品产物发布成正式 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: MelodyFlow ${{ github.event.inputs.version || github.ref_name }}
          body_path: .github/release_template.md
          files: |
            android-apk/*
            windows-zip/*
            ios-ipa/*
          draft: false
          prerelease: false
