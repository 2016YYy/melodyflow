name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Diagnose network and java TLS
        run: |
          echo "=== java ==="
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== curl to plugin portal ==="
          curl -sSI --max-time 20 https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom 2>&1 | head -5 || echo CURL_FAILED
          echo "=== java https to plugin portal ==="
          cat > /tmp/HttpsProbe.java <<'JAVAEOF'
          import java.net.*;
          import javax.net.ssl.*;
          public class HttpsProbe {
            public static void main(String[] args) {
              String[] urls = {
                "https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom",
                "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.2.20/kotlin-stdlib-2.2.20.pom"
              };
              for (String u : urls) {
                try {
                  HttpsURLConnection c = (HttpsURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(20000); c.setReadTimeout(20000);
                  System.out.println("JAVA_HTTPS " + c.getResponseCode() + " " + u);
                } catch (Exception e) {
                  System.out.println("JAVA_HTTPS_FAIL " + e.getClass().getSimpleName() + ": " + e.getMessage() + " " + u);
                }
              }
            }
          }
          JAVAEOF
          java /tmp/HttpsProbe.java 2>&1 || true
          echo "=== gradle version + info ==="
          cd android
          ./gradlew --version 2>&1 | grep -E "Gradle|JVM|Kotlin" || true
          ./gradlew help --info 2>&1 | grep -iE "kotlin-dsl|plugins.gradle|Could not|Resource missing|ssl|proxy|UnknownHost|Connect" | head -40 || true
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/melodyflow-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APK
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: melodyflow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Calculate SHA-256
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk melodyflow-${VERSION}-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk.sha256 melodyflow-${VERSION}-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: melodyflow-*.apk*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath melodyflow-${VERSION}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: melodyflow-*.zip

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r melodyflow-${VERSION}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/melodyflow-*.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: MelodyFlow ${{ github.event.inputs.version || github.ref_name }}
          body_path: .github/release_template.md
          files: |
            android-apk/*
            windows-zip/*
            ios-ipa/*
          draft: false
          prerelease: false
