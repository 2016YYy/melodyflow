name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Clear gradle caches
        run: |
          rm -rf ~/.gradle/caches/modules-2 || true
          rm -rf ~/.gradle/caches/jars-* || true
          ls ~/.gradle/caches 2>/dev/null || echo "no gradle caches"

      - name: Patch flutter_tools (remove kotlin-dsl only)
        run: |
          set -e
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          BG="$FLUTTER_DIR/packages/flutter_tools/gradle/build.gradle.kts"
          echo "Patching $BG"
          cp "$BG" /tmp/build.gradle.kts.orig
          # 仅删除 kotlin-dsl 声明行（included build 无法命中 Gradle 内置插件短路，会去仓库找不存在的 marker）
          sed -i '/^[[:space:]]*`kotlin-dsl`[[:space:]]*$/d' "$BG"
          # Kotlin JVM 插件版本改为 2.4.10：该版本已在本 job 的最小复现中
          # 被 Gradle 成功从插件仓库下载（2.2.20 在此环境反复解析失败）
          sed -i 's/kotlin("jvm") version "2.2.20"/kotlin("jvm") version "2.4.10"/' "$BG"
          echo "=== diff ==="
          diff /tmp/build.gradle.kts.orig "$BG" || true
          echo "=== remaining kotlin-dsl references (should be none) ==="
          grep -n 'kotlin-dsl' "$BG" || echo "none"
          echo "=== patched plugins block ==="
          sed -n '1,15p' "$BG"
          # included build 缺少 pluginManagement，默认仅 gradlePluginPortal；
          # 显式加入 Maven Central（kotlin jvm marker 在其上确认存在）
          SG="$FLUTTER_DIR/packages/flutter_tools/gradle/settings.gradle.kts"
          echo "=== original settings.gradle.kts ==="
          cat "$SG"
          {
            echo 'pluginManagement {'
            echo '    repositories {'
            echo '        gradlePluginPortal()'
            echo '        mavenCentral()'
            echo '        google()'
            echo '    }'
            echo '}'
            echo 'dependencyResolutionManagement {'
            echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)'
            echo '    repositories {'
            echo '        google()'
            echo '        mavenCentral()'
            echo '    }'
            echo '}'
          } > "$SG"
          echo "=== patched settings.gradle.kts ==="
          cat "$SG"
          echo "=== patched settings.gradle.kts ==="
          cat "$SG"

      - name: Pre-build flutter_tools gradle plugin (root build)
        run: |
          set +e
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          PLUGIN_DIR="$FLUTTER_DIR/packages/flutter_tools/gradle"
          cd "$PLUGIN_DIR"
          echo "=== building flutter_tools gradle plugin as ROOT build with system gradle ==="
          # 关键：把完整输出落盘再提取错误，不要用 tail -40 截断
          #（历史上 tail -40 把真正的 Kotlin 编译错误切掉了，导致根因长期不可见）
          gradle build --no-daemon --stacktrace > /tmp/prebuild.log 2>&1
          PREBUILD_EXIT=$?
          echo "PREBUILD_EXIT=$PREBUILD_EXIT"
          if [ $PREBUILD_EXIT -ne 0 ]; then
            echo "=== prebuild 失败：错误摘要 ==="
            grep -E "^e: |error:|Compilation error|What went wrong|Could not|Caused by:" /tmp/prebuild.log | head -30
            echo "=== prebuild 失败：编译错误上下文 ==="
            grep -B2 -A6 "^e: " /tmp/prebuild.log | head -40
          fi
          echo "=== build outputs ==="
          ls -la build/libs 2>/dev/null || echo "no build/libs"
          gradle --stop 2>&1 | tail -3 || true
          cd /

      - name: Diagnose network and java TLS
        run: |
          echo "=== java ==="
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== curl: Google Maven (AGP 所在仓库，最关键) ==="
          for u in \
            "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/8.9.1/com.android.application.gradle.plugin-8.9.1.pom" \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.1/gradle-8.9.1.pom" ; do
            echo "--- $u"
            curl -sSI --max-time 25 "$u" 2>&1 | head -4 || echo "CURL_FAILED: $u"
          done
          echo "=== curl: plugin portal / maven central ==="
          curl -sSI --max-time 20 https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom 2>&1 | head -4 || echo CURL_FAILED
          curl -sSI --max-time 20 https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.pom 2>&1 | head -4 || echo CURL_FAILED
          echo "=== java https probe ==="
          cat > /tmp/HttpsProbe.java <<'JAVAEOF'
          import java.net.*;
          import javax.net.ssl.*;
          public class HttpsProbe {
            public static void main(String[] args) {
              String[] urls = {
                "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.1/gradle-8.9.1.pom",
                "https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom",
                "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.pom"
              };
              for (String u : urls) {
                try {
                  HttpsURLConnection c = (HttpsURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(25000); c.setReadTimeout(25000);
                  System.out.println("JAVA_HTTPS " + c.getResponseCode() + " " + u);
                } catch (Exception e) {
                  System.out.println("JAVA_HTTPS_FAIL " + e.getClass().getSimpleName() + ": " + e.getMessage() + " " + u);
                }
              }
            }
          }
          JAVAEOF
          java /tmp/HttpsProbe.java 2>&1 || true
          echo "=== gradle version ==="
          cd android
          ./gradlew --version 2>&1 | grep -E "Gradle|JVM|Kotlin" || true
          echo "=== gradle 解析 AGP 的真实错误（--info 抓取，不截断关键行）==="
          ./gradlew help --info --stacktrace > /tmp/gradle-help.log 2>&1 || true
          grep -iE "Could not (resolve|GET|HEAD|download)|Resource missing|dl\.google\.com|Connection reset|timed out|SSL|UnknownHost|Could not resolve plugin" /tmp/gradle-help.log | head -30 || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/melodyflow-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Stop gradle daemons before build
        run: |
          cd android
          ./gradlew --stop 2>&1 | tail -3 || true
          pkill -f GradleDaemon 2>/dev/null || true
          rm -rf ~/.gradle/daemon || true
          cd ..

      - name: Configure Gradle network resilience
        run: |
          # GitHub runner 访问 Google Maven 偶发超时/连接重置，
          # 这里统一设置连接超时、读取超时与重试次数，避免单次网络抖动直接让整次构建失败。
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPEOF'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          systemProp.org.gradle.internal.http.retry.max=10
          org.gradle.daemon=true
          org.gradle.parallel=false
          org.gradle.caching=true
          PROPEOF
          echo "=== ~/.gradle/gradle.properties ==="
          cat ~/.gradle/gradle.properties
          # 预热 Google Maven 连通性：若此处失败说明 runner 到 Google Maven 不通，
          # 后续构建必然失败，直接给出明确结论而不是让 Gradle 报模糊的"plugin not found"
          echo "=== warm-up: Google Maven ==="
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/8.9.1/com.android.application.gradle.plugin-8.9.1.pom" || echo "000")
            echo "  attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "  Google Maven 可达"; break; fi
            sleep $((i*10))
          done

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee /tmp/apk-build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== build failed: 完整错误上下文 ==="
            # 输出真实失败原因（Gradle 默认只给 'plugin not found' 这类模糊信息）
            grep -B5 -A20 "What went wrong" /tmp/apk-build.log | head -60
            echo "=== 网络类错误线索 ==="
            grep -iE "Could not (resolve|GET|HEAD|download)|Resource missing|dl\.google\.com|Connection reset|timed out|SSLHandshake|UnknownHost|No route to host" /tmp/apk-build.log | head -20 || true
            echo "=== 插件解析相关 ==="
            grep -iE "not found in any of the following sources|Searched in the following" /tmp/apk-build.log | head -10 || true
          fi
          exit $STATUS
        env:
          KEYSTORE_PATH: melodyflow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=10

      - name: Calculate SHA-256
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk melodyflow-${VERSION}-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk.sha256 melodyflow-${VERSION}-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: melodyflow-*.apk*

  build-windows:
    name: Build Windows
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath melodyflow-${VERSION}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: melodyflow-*.zip

  build-ios:
    name: Build iOS IPA
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r melodyflow-${VERSION}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/melodyflow-*.ipa

  release:
    name: Create GitHub Release
    # 仅依赖实际启用的构建产物；windows/ios 当前以 `if: false` 临时禁用，不应阻塞发布
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: MelodyFlow ${{ github.event.inputs.version || github.ref_name }}
          body_path: .github/release_template.md
          files: |
            android-apk/*
            windows-zip/*
            ios-ipa/*
          draft: false
          prerelease: false
