name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.1)'
        required: true
        default: '1.0.1'
      build_ref:
        description: '要构建的 ref（留空=当前分支/标签）。补建历史版本的 Release 时填该 tag，例如 v1.7.1'
        required: false
        default: ''

# 2026-10-29: 强制重新注册 workflow（rerun 复用旧定义，必须新 commit 才生效）
permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # 手动 dispatch 时若填了 build_ref，就检出那个 ref；否则检出发起运行的分支/标签。
      # 用途：历史 tag（如 v1.7.0 / v1.7.1）当年的 workflow 里没有下方的补丁步骤，
      # 直接用 tag 重跑必然复现当年的失败。改成「用 main 的最新 workflow + 检出老 ref 的代码」，
      # 既不重写历史 tag，又能让老版本按现在的构建环境重新打包。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.ref }}
          fetch-depth: 0

      - name: Mark build ref
        run: |
          echo "BUILD_REF=${{ github.event.inputs.build_ref }}" >> "$GITHUB_ENV"
          echo "checkout ref = ${{ github.event.inputs.build_ref || github.ref }}"
          git log --oneline -1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      # 老 ref（build_ref 非空）的代码树里没有后来才补上的构建适配，
      # 直接构建必然复现当年失败。这里在 checkout 之后、编译之前补齐：
      #   · 缺 namespace 的老插件（AGP 8 强制要求）
      #   · 缺 compileOptions 的老插件导致的 JVM target 不一致
      # 脚本是幂等的：检测到已修过就跳过，所以在最新代码上是零改动。
      - name: Patch legacy build config
        run: |
          set -e
          # checkout 出来的是 build_ref 指定的老 ref，它自己的 scripts/ 里没有这个补丁脚本
          # （脚本是本轮才加的）。所以从远端分支把工具脚本单独取过来，不改动老 ref 的业务代码。
          SCRIPT_DIR="$RUNNER_TEMP/legacy-patch"
          mkdir -p "$SCRIPT_DIR"
          git fetch --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          git show origin/main:scripts/patch_legacy_tag.py > "$SCRIPT_DIR/patch_legacy_tag.py"
          echo "补丁脚本 $(wc -c < "$SCRIPT_DIR/patch_legacy_tag.py") bytes"
          # 脚本在临时目录，不能靠自身位置推断项目根，显式指定 --root
          python3 "$SCRIPT_DIR/patch_legacy_tag.py" --root "$GITHUB_WORKSPACE"
          echo "=== 补丁后 diff ==="
          git --no-pager diff --stat || true

      # app/build.gradle.kts 里 ndkVersion = flutter.ndkVersion（Flutter 3.44.9 对应
      # 27.0.12077973）。runner 镜像不保证预装该版本，缺失时 AGP 在配置 :app 阶段直接报
      # "NDK not configured. Download it with SDK manager. Preferred NDK version is '27.0.12077973'."
      # 因此这里显式安装，保证构建环境自足。
      - name: Install Android NDK
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          # ── 唯一权威来源 ────────────────────────────────────────────────────
          # Flutter 3.44.9 里 flutter.ndkVersion 的真实值写在两个地方，必须一致：
          #   packages/flutter_tools/lib/src/android/gradle_utils.dart:69
          #       const ndkVersion = '28.2.13676358';
          #   packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt
          #       val ndkVersion: String = "28.2.13676358"
          # 之前一直以为 3.44.x 是 27.0.12077973 —— 那是 AGP 8.9 自己的默认 NDK，
          # 也是报错信息 "Preferred NDK version is '27.0.12077973'" 里那个数字，
          # 极具误导性。于是 CI 反复安装 27.x，AGP 配置 :jni 时仍然说找不到。
          # 现在直接从 Flutter 源码里读，读到什么就装什么，绝不硬编码。
          GRADLE_UTILS="$FLUTTER_ROOT/packages/flutter_tools/lib/src/android/gradle_utils.dart"
          FLUTTER_EXT="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          FLUTTER_NDK=""
          if [ -f "$GRADLE_UTILS" ]; then
            FLUTTER_NDK="$(grep -oE "const ndkVersion = '[0-9.]+'" "$GRADLE_UTILS" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)"
          fi
          if [ -z "$FLUTTER_NDK" ] && [ -f "$FLUTTER_EXT" ]; then
            FLUTTER_NDK="$(grep -oE 'val ndkVersion: String = "[0-9.]+"' "$FLUTTER_EXT" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)"
          fi
          echo "Flutter (flutter.ndkVersion) 声明的 NDK = ${FLUTTER_NDK:-未探测到}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for c in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
          fi
          if [ -z "$SDKMGR" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "using sdkmanager: $SDKMGR"
          # ── 选版 ────────────────────────────────────────────────────────────
          # 硬约束（四轮实测结论）：media_kit 传递进来的 :jni 子工程里写死
          #     ndkVersion = flutter.ndkVersion
          # 而 AGP 在 plugin apply 那一刻就注册了自己的 afterEvaluate
          # （CrashReporting$afterEvaluate$1 -> BasePlugin.createAndroidTasks ->
          #  NdkLocatorKt.findNdkPathImpl）并解析定型 NDK。root 侧所有事后覆盖都失败：
          #   · subprojects{} 里直接设            —— 被子工程脚本自己的赋值改回去
          #   · afterEvaluate 反射 setNdkVersion  —— 与 AGP 同阶段，顺序不可控
          #   · plugins.withId + afterEvaluate    —— 同上
          #   · gradle.lifecycle.beforeProject    —— 抛
          #     "GradleLifecycle#beforeProject cannot be called after settings have been evaluated."
          # 所以不去覆盖，而是保证 SDK 里真的存在 flutter.ndkVersion 这个版本。
          if [ -z "$FLUTTER_NDK" ]; then
            echo "ERROR: 无法从 Flutter SDK 探测 flutter.ndkVersion，拒绝瞎猜版本"
            ls -la "$FLUTTER_ROOT/packages/flutter_tools/lib/src/android/" || true
            exit 1
          fi
          NDK_PIN="$FLUTTER_NDK"
          if [ -f "$SDK_ROOT/ndk/$NDK_PIN/source.properties" ]; then
            echo "NDK $NDK_PIN 已注册，直接使用"
          else
            echo "=== 安装 flutter.ndkVersion 对应的 NDK $NDK_PIN ==="
            rm -rf "${SDK_ROOT:?}/ndk/$NDK_PIN" 2>/dev/null || true
            yes 2>/dev/null | "$SDKMGR" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_PIN" > "/tmp/ndk-install-$NDK_PIN.log" 2>&1 || true
            tail -6 "/tmp/ndk-install-$NDK_PIN.log" || true
          fi
          if [ ! -f "$SDK_ROOT/ndk/$NDK_PIN/source.properties" ]; then
            echo "ERROR: NDK $NDK_PIN 安装失败，:jni 一定还会报 NDK not configured"
            ls -la "$SDK_ROOT/ndk" || true
            exit 1
          fi
          echo "=== 最终 NDK 目录 ==="
          ls -la "$SDK_ROOT/ndk" || true
          echo "=== 注册状态检查（AGP 只认带 source.properties 的 NDK 目录）==="
          for d in "$SDK_ROOT"/ndk/*/; do
            v="$(basename "$d")"
            if [ -f "$d/source.properties" ]; then
              echo "  OK   $v -> $(grep -E '^Pkg.Revision' "$d/source.properties" | head -1)"
            else
              echo "  BAD  $v 缺少 source.properties（AGP 会视为未安装）"
            fi
          done
          echo "选用 NDK 版本: $NDK_PIN"
          echo "MELODYFLOW_NDK_VERSION=$NDK_PIN" >> "$GITHUB_ENV"

      # 老插件 on_audio_query_android 1.1.0 的 android/build.gradle 写死 compileSdkVersion 33，
      # GitHub 镜像只预装 Flutter 需要的平台（36 等），没有 33，于是报：
      #   Failed to find target with hash string 'android-33' in: $ANDROID_SDK_ROOT
      # root 侧的反射兜底（legacyCompileSdkFixes）实测在 v1.7.0 上不生效 ——
      # 无论 plugins.withId 还是 gradle.projectsEvaluated，日志里一行 [compileSdk-fix] 都没有，
      # 说明这个老包的 compileSdk 在更早的 DSL 求值阶段就被固化了。
      # 与其继续反射，不如直接把 android-33 平台装进 SDK：确定性最强，也不碰插件源码。
      - name: Ensure legacy SDK platforms and CMake
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for c in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
          fi
          if [ -z "$SDKMGR" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "=== 现有 platforms ==="
          ls -1 "$SDK_ROOT/platforms" 2>/dev/null || true
          for P in 33; do
            # P=33: on_audio_query_android 写死 compileSdkVersion 33
            if [ -f "$SDK_ROOT/platforms/android-$P/source.properties" ] || [ -f "$SDK_ROOT/platforms/android-$P/android.jar" ]; then
              echo "platform android-$P 已存在，跳过"
            else
              echo "=== 安装 platforms;android-$P ==="
              yes 2>/dev/null | "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platforms;android-$P" > "/tmp/sdk-platform-$P.log" 2>&1 || true
              tail -5 "/tmp/sdk-platform-$P.log" || true
            fi
            if [ -d "$SDK_ROOT/platforms/android-$P" ]; then
              echo "  OK   android-$P 就位"
            else
              echo "  WARN android-$P 仍缺失（构建可能失败）"
            fi
          done
          echo "=== 最终 platforms ==="
          ls -1 "$SDK_ROOT/platforms" 2>/dev/null || true
          # ── CMake ────────────────────────────────────────────────────────────
          # android-33 就位后新暴露：:app:configureCMakeRelease[arm64-v8a] 报
          #   [CXX1300] CMake '3.22.1' was not found in SDK, PATH, or by cmake.dir property.
          # AGP 默认要 CMake 3.22.1，GitHub 镜像没预装。同样用 sdkmanager 装。
          for C in 3.22.1; do
            if [ -x "$SDK_ROOT/cmake/$C/bin/cmake" ]; then
              echo "cmake $C 已存在，跳过"
            else
              echo "=== 安装 cmake;$C ==="
              yes 2>/dev/null | "$SDKMGR" --sdk_root="$SDK_ROOT" --install "cmake;$C" > "/tmp/sdk-cmake-$C.log" 2>&1 || true
              tail -5 "/tmp/sdk-cmake-$C.log" || true
            fi
            if [ -x "$SDK_ROOT/cmake/$C/bin/cmake" ]; then
              echo "  OK   cmake $C -> $("$SDK_ROOT/cmake/$C/bin/cmake" --version | head -1)"
            else
              echo "  WARN cmake $C 仍缺失（构建可能失败）"
            fi
          done
          echo "=== 最终 cmake ==="
          ls -1 "$SDK_ROOT/cmake" 2>/dev/null || true

      - name: Install dependencies
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "resolved SDK_ROOT=$SDK_ROOT"
          # 显式锁定 Android SDK，避免 flutter 自行探测到别的 SDK 目录后，
          # 把错误的 sdk.dir 写进 android/local.properties，导致 AGP 在该 SDK 下找不到 NDK。
          flutter config --android-sdk "$SDK_ROOT" || true
          flutter pub get
          # 只写 sdk.dir，【绝不写 ndk.dir】：
          # 之前这里写过 ndk.dir=$SDK_ROOT/ndk/$NDK_PIN，结果日志里读回来的是
          #     ndk.dir=/usr/local/lib/android/sdk/ndk/
          # 版本段丢了，AGP 的 NdkLocator 拿到这个目录当 NDK 根，直接报
          #     [CXX1101] NDK at /usr/local/lib/android/sdk/ndk did not have a source.properties file
          # 而 sdk/ndk 下 27.3/28.2/29/30 四个版本全都有 source.properties（同一次日志可证），
          # 所以 CXX1101 说的"缺文件"是被误导后的假象。AGP 扫 sdk.dir/ndk 时按版本目录解析，
          # 只要 flutter.ndkVersion 对应的 28.2.13676358 已注册就能命中，反而更稳。
          NDK_PIN="${MELODYFLOW_NDK_VERSION:-}"
          echo "MELODYFLOW_NDK_VERSION=$NDK_PIN"
          if [ -n "$NDK_PIN" ] && [ ! -f "$SDK_ROOT/ndk/$NDK_PIN/source.properties" ]; then
            echo "WARN: NDK $NDK_PIN 缺少 source.properties，AGP 可能报 CXX1101"
          fi
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_DIR="$(dirname "$(dirname "$FLUTTER_BIN")")"
          {
            echo "sdk.dir=$SDK_ROOT"
            echo "flutter.sdk=$FLUTTER_DIR"
          } > android/local.properties
          echo "=== android/local.properties（不含 ndk.dir）==="
          cat android/local.properties
          echo "=== SDK 内已注册的 NDK 版本 ==="
          for d in "$SDK_ROOT"/ndk/*/; do
            if [ -f "$d/source.properties" ]; then echo "  OK   $(basename "$d")"; else echo "  BAD  $(basename "$d")"; fi
          done

      - name: Clear gradle caches
        run: |
          rm -rf ~/.gradle/caches/modules-2 || true
          rm -rf ~/.gradle/caches/jars-* || true
          ls ~/.gradle/caches 2>/dev/null || echo "no gradle caches"

      - name: Patch flutter_tools (repositories only, keep kotlin-dsl)
        run: |
          set -e
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          BG="$FLUTTER_DIR/packages/flutter_tools/gradle/build.gradle.kts"
          echo "flutter_tools build file: $BG"
          cp "$BG" /tmp/build.gradle.kts.orig

          # 重要：这里【不再】删除 `kotlin-dsl` 声明。
          # 历史版本曾因"included build 无法解析 kotlin-dsl"而删掉该行，
          # 但那是因为 android/gradle.properties 里的本地代理(127.0.0.1:18080)
          # 导致插件无法下载。代理问题已修复，kotlin-dsl 可正常解析；
          # 而 kotlin-dsl 正是提供 Gradle Kotlin DSL API
          # (extra / doLast / dependsOn / repositories / matchingFallbacks ...)
          # 的插件，删除它会导致 flutter_tools 插件编译报大量
          # "Unresolved reference" 错误。

          echo "=== plugins block (保持原样，不做任何删除) ==="
          sed -n '1,15p' "$BG"
          echo "=== 确认 kotlin-dsl 仍在 ==="
          grep -n 'kotlin-dsl' "$BG" || { echo "ERROR: kotlin-dsl 缺失，终止构建"; exit 1; }

          # included build 缺少 pluginManagement，默认仅 gradlePluginPortal；
          # 显式加入 Maven Central 与 Google（kotlin-dsl / kotlin jvm marker 所在仓库）
          SG="$FLUTTER_DIR/packages/flutter_tools/gradle/settings.gradle.kts"
          echo "=== original settings.gradle.kts ==="
          cat "$SG"
          {
            echo 'pluginManagement {'
            echo '    repositories {'
            echo '        gradlePluginPortal()'
            echo '        mavenCentral()'
            echo '        google()'
            echo '    }'
            echo '}'
            echo 'dependencyResolutionManagement {'
            echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)'
            echo '    repositories {'
            echo '        google()'
            echo '        mavenCentral()'
            echo '    }'
            echo '}'
          } > "$SG"
          echo "=== patched settings.gradle.kts ==="
          cat "$SG"


      - name: Pre-warm flutter_tools gradle plugin deps (非阻塞，失败不中断)
        continue-on-error: true
        run: |
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          PLUGIN_DIR="$FLUTTER_DIR/packages/flutter_tools/gradle"
          cd "$PLUGIN_DIR"
          echo "=== building flutter_tools gradle plugin as ROOT build with system gradle ==="
          # 关键：把完整输出落盘再提取错误，不要用 tail -40 截断
          #（历史上 tail -40 把真正的 Kotlin 编译错误切掉了，导致根因长期不可见）
          # 只构建主产物 jar：历史上用 \`gradle build\` 会连带执行 compileTestKotlin 与
          # validatePlugins，而 Flutter SDK 自带的测试源码在离线/无 junit 依赖环境下必然编译失败，
          # 会把这个"预热"步骤本身变成失败源，掩盖真正的项目构建问题。
          timeout 240 gradle jar --no-daemon --offline > /tmp/prebuild.log 2>&1 || timeout 240 gradle jar --no-daemon > /tmp/prebuild.log 2>&1
          PREBUILD_EXIT=$?
          if [ $PREBUILD_EXIT -ne 0 ]; then
            echo "=== prebuild 失败：错误摘要 ==="
            grep -E "^e: |error:|Compilation error|What went wrong|Could not|Caused by:" /tmp/prebuild.log | head -30
            echo "=== prebuild 失败：编译错误上下文 ==="
            grep -B2 -A6 "^e: " /tmp/prebuild.log | head -40
            echo "=== prebuild 失败：仓库解析线索 ==="
            grep -iE "Could not resolve plugin|Plugin .* was not found|Resource missing|dl\.google\.com" /tmp/prebuild.log | head -20
          fi
          echo "=== build outputs ==="
          ls -la build/libs 2>/dev/null || echo "no build/libs"
          gradle --stop 2>&1 | tail -3 || true
          cd /

      - name: Diagnose network and java TLS
        run: |
          echo "=== java ==="
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== curl: Google Maven (AGP 所在仓库，最关键) ==="
          for u in \
            "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/8.9.1/com.android.application.gradle.plugin-8.9.1.pom" \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.1/gradle-8.9.1.pom" ; do
            echo "--- $u"
            curl -sSI --max-time 25 "$u" 2>&1 | head -4 || echo "CURL_FAILED: $u"
          done
          echo "=== curl: plugin portal / maven central ==="
          curl -sSI --max-time 20 https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom 2>&1 | head -4 || echo CURL_FAILED
          curl -sSI --max-time 20 https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.pom 2>&1 | head -4 || echo CURL_FAILED
          echo "=== java https probe ==="
          cat > /tmp/HttpsProbe.java <<'JAVAEOF'
          import java.net.*;
          import javax.net.ssl.*;
          public class HttpsProbe {
            public static void main(String[] args) {
              String[] urls = {
                "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.1/gradle-8.9.1.pom",
                "https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom",
                "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.pom"
              };
              for (String u : urls) {
                try {
                  HttpsURLConnection c = (HttpsURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(25000); c.setReadTimeout(25000);
                  System.out.println("JAVA_HTTPS " + c.getResponseCode() + " " + u);
                } catch (Exception e) {
                  System.out.println("JAVA_HTTPS_FAIL " + e.getClass().getSimpleName() + ": " + e.getMessage() + " " + u);
                }
              }
            }
          }
          JAVAEOF
          java /tmp/HttpsProbe.java 2>&1 || true
          echo "=== gradle version ==="
          cd android
          ./gradlew --version 2>&1 | grep -E "Gradle|JVM|Kotlin" || true
          echo "=== gradle 解析 AGP 的真实错误（--info 抓取，不截断关键行）==="
          ./gradlew help --info --stacktrace > /tmp/gradle-help.log 2>&1 || true
          grep -iE "Could not (resolve|GET|HEAD|download)|Resource missing|dl\.google\.com|Connection reset|timed out|SSL|UnknownHost|Could not resolve plugin" /tmp/gradle-help.log | head -30 || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/melodyflow-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Stop gradle daemons before build
        run: |
          cd android
          ./gradlew --stop 2>&1 | tail -3 || true
          pkill -f GradleDaemon 2>/dev/null || true
          rm -rf ~/.gradle/daemon || true
          cd ..

      - name: Configure Gradle network resilience
        run: |
          # GitHub runner 访问 Google Maven 偶发超时/连接重置，
          # 这里统一设置连接超时、读取超时与重试次数，避免单次网络抖动直接让整次构建失败。
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPEOF'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          systemProp.org.gradle.internal.http.retry.max=10
          org.gradle.daemon=true
          org.gradle.parallel=false
          org.gradle.caching=true
          PROPEOF
          echo "=== ~/.gradle/gradle.properties ==="
          cat ~/.gradle/gradle.properties
          # 预热 Google Maven 连通性：若此处失败说明 runner 到 Google Maven 不通，
          # 后续构建必然失败，直接给出明确结论而不是让 Gradle 报模糊的"plugin not found"
          echo "=== warm-up: Google Maven ==="
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/8.9.1/com.android.application.gradle.plugin-8.9.1.pom" || echo "000")
            echo "  attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "  Google Maven 可达"; break; fi
            sleep $((i*10))
          done

      - name: Diagnose NDK resolution
        run: |
          set +e
          echo "MELODYFLOW_NDK_VERSION=$MELODYFLOW_NDK_VERSION"
          echo "=== Flutter 侧 ndkVersion 声明 ==="
          grep -rn "ndkVersion" "$FLUTTER_ROOT/packages/flutter_tools/gradle/src" 2>/dev/null | head -10
          echo "=== SDK ndk 目录 ==="
          ls -la "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" 2>/dev/null
          echo "=== Flutter 模板 android/app/build.gradle.kts 里的 ndk 行 ==="
          grep -n "ndkVersion" android/app/build.gradle.kts || true
          echo "=== Gradle 配置 :app 的真实堆栈（grep NDK 相关帧）==="
          cd android
          ./gradlew help --stacktrace --no-daemon > /tmp/ndk-diag.log 2>&1
          grep -nE "NDK not configured|ndkVersion|NdkLocator|NdkHandler|Caused by|at com\.android" /tmp/ndk-diag.log | head -40
          echo "=== 若有 NDK 报错，输出其上下文 ==="
          grep -B3 -A25 "NDK not configured" /tmp/ndk-diag.log | head -60
          cd ..

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee /tmp/apk-build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== build failed: 完整错误上下文 ==="
            # 输出真实失败原因（Gradle 默认只给 'plugin not found' 这类模糊信息）
            grep -B5 -A20 "What went wrong" /tmp/apk-build.log | head -60
            echo "=== 网络类错误线索 ==="
            grep -iE "Could not (resolve|GET|HEAD|download)|Resource missing|dl\.google\.com|Connection reset|timed out|SSLHandshake|UnknownHost|No route to host" /tmp/apk-build.log | head -20 || true
            echo "=== 插件解析相关 ==="
            grep -iE "not found in any of the following sources|Searched in the following" /tmp/apk-build.log | head -10 || true
            echo "=== NDK / SDK 诊断 ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "--- android/local.properties ---"
            cat android/local.properties || true
            echo "--- ${ANDROID_HOME}/ndk ---"
            ls -la "${ANDROID_HOME}/ndk" 2>/dev/null || true
            echo "--- 已安装 NDK 的 source.properties ---"
            find "${ANDROID_HOME}" -maxdepth 3 -name source.properties 2>/dev/null | head -10 || true
            echo "--- app/build.gradle.kts 中 ndk 相关行 ---"
            grep -n "ndk" android/app/build.gradle.kts || true
          fi
          exit $STATUS
        env:
          KEYSTORE_PATH: melodyflow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=10

      - name: Calculate SHA-256
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.build_ref || github.event.inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk melodyflow-${VERSION}-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk.sha256 melodyflow-${VERSION}-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: melodyflow-*.apk*

  build-windows:
    name: Build Windows
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.build_ref || github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath melodyflow-${VERSION}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: melodyflow-*.zip

  build-ios:
    name: Build iOS IPA
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          VERSION="${{ github.event.inputs.build_ref || github.event.inputs.version || github.ref_name }}"
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r melodyflow-${VERSION}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/melodyflow-*.ipa

  release:
    name: Create GitHub Release
    # 仅依赖实际启用的构建产物；windows/ios 当前以 `if: false` 临时禁用，不应阻塞发布
    needs: [build-android]
    # 两种允许发布的情形：
    #   1) tag 推送触发（正式发版）
    #   2) workflow_dispatch 且填了 build_ref（补建历史版本的 Release）
    # 普通 workflow_dispatch（只填 version、不填 build_ref）仍然只验证构建，不发布，
    # 防止一次验证运行就把半成品产物发布成正式 Release。
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # release_template.md 是跟着 tag 一起提交的，旧 tag 里那份写的是当年的版本号。
      # 直接 body_path 引用会让补建出来的 Release 标题/资产名全是错的 —— 实测 v1.7.0 的
      # Release 正文标题写着「MelodyFlow v1.7.1」、下载表写 melodyflow-v1.7.1-android.apk。
      # 这里先把模板里的版本号统一替换成本次发布的目标版本，再交给 action-gh-release 读。
      - name: Render release body
        run: |
          set -e
          VERSION="${{ github.event.inputs.build_ref || github.event.inputs.version || github.ref_name }}"
          SRC=".github/release_template.md"
          OUT="$RUNNER_TEMP/release_body.md"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: 缺少 $SRC"
            exit 1
          fi
          echo "=== 渲染 $SRC -> $OUT （目标版本 $VERSION） ==="
          grep -nE 'v[0-9]+\.[0-9]+\.[0-9]+' "$SRC" | head -20 || true
          sed -E "s/v[0-9]+\.[0-9]+\.[0-9]+/${VERSION}/g" "$SRC" > "$OUT"
          echo "=== 渲染后 ==="
          head -1 "$OUT"
          echo "BODY_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.build_ref || github.event.inputs.version || github.ref_name }}
          name: MelodyFlow ${{ github.event.inputs.build_ref || github.event.inputs.version || github.ref_name }}
          body_path: ${{ env.BODY_PATH }}
          # 只上传实际启用的产物。windows-zip / ios-ipa 当前 job 是 if: false，
          # 列在这里会让 action-gh-release 因找不到文件而失败。
          files: |
            android-apk/*
          draft: false
          prerelease: false
