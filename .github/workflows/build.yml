name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Clear gradle caches
        run: |
          rm -rf ~/.gradle/caches/modules-2 || true
          rm -rf ~/.gradle/caches/jars-* || true
          ls ~/.gradle/caches 2>/dev/null || echo "no gradle caches"

      - name: Patch flutter_tools (remove kotlin-dsl only)
        run: |
          set -e
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          BG="$FLUTTER_DIR/packages/flutter_tools/gradle/build.gradle.kts"
          echo "Patching $BG"
          cp "$BG" /tmp/build.gradle.kts.orig
          # 仅删除 kotlin-dsl 声明行（included build 无法命中 Gradle 内置插件短路，会去仓库找不存在的 marker）
          sed -i '/^[[:space:]]*`kotlin-dsl`[[:space:]]*$/d' "$BG"
          # Kotlin JVM 插件版本改为 2.4.10：该版本已在本 job 的最小复现中
          # 被 Gradle 成功从插件仓库下载（2.2.20 在此环境反复解析失败）
          sed -i 's/kotlin("jvm") version "2.2.20"/kotlin("jvm") version "2.4.10"/' "$BG"
          echo "=== diff ==="
          diff /tmp/build.gradle.kts.orig "$BG" || true
          echo "=== remaining kotlin-dsl references (should be none) ==="
          grep -n 'kotlin-dsl' "$BG" || echo "none"
          echo "=== patched plugins block ==="
          sed -n '1,15p' "$BG"
          # included build 缺少 pluginManagement，默认仅 gradlePluginPortal；
          # 显式加入 Maven Central（kotlin jvm marker 在其上确认存在）
          SG="$FLUTTER_DIR/packages/flutter_tools/gradle/settings.gradle.kts"
          echo "=== original settings.gradle.kts ==="
          cat "$SG"
          {
            echo 'pluginManagement {'
            echo '    repositories {'
            echo '        gradlePluginPortal()'
            echo '        mavenCentral()'
            echo '        google()'
            echo '    }'
            echo '}'
            echo 'dependencyResolutionManagement {'
            echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)'
            echo '    repositories {'
            echo '        google()'
            echo '        mavenCentral()'
            echo '    }'
            echo '}'
          } > "$SG"
          echo "=== patched settings.gradle.kts ==="
          cat "$SG"
          echo "=== patched settings.gradle.kts ==="
          cat "$SG"

      - name: Pre-build flutter_tools gradle plugin (root build)
        run: |
          set +e
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          PLUGIN_DIR="$FLUTTER_DIR/packages/flutter_tools/gradle"
          cd "$PLUGIN_DIR"
          echo "=== building flutter_tools gradle plugin as ROOT build with system gradle ==="
          echo "note: root build 的插件解析已由最小复现证明可用"
          gradle build --no-daemon --stacktrace 2>&1 | tail -40
          echo "PREBUILD_EXIT=${PIPESTATUS[0]}"
          echo "=== build outputs ==="
          ls -la build/libs 2>/dev/null || echo "no build/libs"
          gradle --stop 2>&1 | tail -3 || true
          cd /

      - name: Diagnose network and java TLS
        run: |
          echo "=== java ==="
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== curl to plugin portal ==="
          curl -sSI --max-time 20 https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom 2>&1 | head -5 || echo CURL_FAILED
          echo "=== java https to plugin portal ==="
          cat > /tmp/HttpsProbe.java <<'JAVAEOF'
          import java.net.*;
          import javax.net.ssl.*;
          public class HttpsProbe {
            public static void main(String[] args) {
              String[] urls = {
                "https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.2.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-5.2.0.pom",
                "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.2.20/kotlin-stdlib-2.2.20.pom"
              };
              for (String u : urls) {
                try {
                  HttpsURLConnection c = (HttpsURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(20000); c.setReadTimeout(20000);
                  System.out.println("JAVA_HTTPS " + c.getResponseCode() + " " + u);
                } catch (Exception e) {
                  System.out.println("JAVA_HTTPS_FAIL " + e.getClass().getSimpleName() + ": " + e.getMessage() + " " + u);
                }
              }
            }
          }
          JAVAEOF
          java /tmp/HttpsProbe.java 2>&1 || true
          echo "=== gradle version + info ==="
          cd android
          ./gradlew --version 2>&1 | grep -E "Gradle|JVM|Kotlin" || true
          ./gradlew help --info 2>&1 | grep -iE "kotlin-dsl|plugins.gradle|Could not|Resource missing|ssl|proxy|UnknownHost|Connect" | head -40 || true
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/melodyflow-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Stop gradle daemons before build
        run: |
          cd android
          ./gradlew --stop 2>&1 | tail -3 || true
          pkill -f GradleDaemon 2>/dev/null || true
          rm -rf ~/.gradle/daemon || true
          cd ..

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee /tmp/apk-build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== build failed: plugin/network context ==="
            grep -iE "kotlin-dsl|plugins.gradle|could not|not found|resolved plugin|ssl|proxy|offline|daemon" /tmp/apk-build.log | head -40
          fi
          exit $STATUS
        env:
          KEYSTORE_PATH: melodyflow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Calculate SHA-256
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk melodyflow-${VERSION}-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk.sha256 melodyflow-${VERSION}-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: melodyflow-*.apk*

  build-windows:
    name: Build Windows
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath melodyflow-${VERSION}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: melodyflow-*.zip

  build-ios:
    name: Build iOS IPA
    if: ${{ false }}   # 临时禁用：集中排查 Android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r melodyflow-${VERSION}-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/melodyflow-*.ipa

  release:
    name: Create GitHub Release
    # 仅依赖实际启用的构建产物；windows/ios 当前以 `if: false` 临时禁用，不应阻塞发布
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: MelodyFlow ${{ github.event.inputs.version || github.ref_name }}
          body_path: .github/release_template.md
          files: |
            android-apk/*
            windows-zip/*
            ios-ipa/*
          draft: false
          prerelease: false
