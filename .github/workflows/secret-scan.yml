name: Secret Scanning

# 每次推送 / PR / 打版本标签时自动扫描敏感信息
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect Secrets with gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史，才能扫描所有版本

      - name: Install gitleaks
        run: |
          VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "gitleaks $VERSION"
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history (all versions)
        run: |
          gitleaks git -c .gitleaks.toml -v --report-format sarif --report-path gitleaks-history.sarif

      - name: Scan working tree
        run: |
          gitleaks dir -c .gitleaks.toml -v --report-format sarif --report-path gitleaks-dir.sarif

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
