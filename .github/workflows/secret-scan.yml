name: Secret Scanning

# 每次推送 / PR / 打版本标签时自动扫描敏感信息
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect Secrets with gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史，才能扫描所有版本

      - name: Install gitleaks (pinned version)
        run: |
          # 固定版本以保证可复现与一致性；如需升级请同步更新下方 VERSION
          VERSION="v8.30.1"
          echo "gitleaks $VERSION"
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history (all versions)
        # 注意：本项目不依赖 .gitleaksignore 掩盖历史泄露；
        # 任何命中都会令本步骤以非零状态退出，从而阻断合并/发布。
        run: |
          gitleaks git -c .gitleaks.toml -v --report-format sarif --report-path gitleaks-history.sarif

      - name: Scan working tree
        run: |
          gitleaks dir -c .gitleaks.toml -v --report-format sarif --report-path gitleaks-dir.sarif

      - name: Fail if any leak found
        if: always()
        run: |
          if grep -lq '"ruleId"' gitleaks-history.sarif gitleaks-dir.sarif 2>/dev/null; then
            echo "::error::Gitleaks 检测到敏感信息泄露，已阻断。请移除泄露并重写 Git 历史后再提交。"
            exit 1
          fi
          echo "✅ 未检测到敏感信息泄露"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
