# 内存与并行设置
org.gradle.jvmargs=-Xmx1536m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 注意：这里【不要】再写 android.builder.sdkDownload=false。
# CI 上 Flutter 会把插件的 ndkVersion 设成 flutter.ndkVersion(28.2.13676358) 并用它建 CXX 任务，
# 而 runner 预装的是 27.3/29/30。一旦禁止 AGP 自动下载，"缺版本"就直接变成
# "NDK not configured" 硬失败；允许下载后 AGP 会在需要时自行补齐。

# 网络代理说明：
# 本文件原先硬编码了 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080，
# 那是某台本地机器的抓包代理配置，且该端口在多数环境下并无监听。
# CI runner 上没有该代理，Gradle 的所有构件下载请求都会失败，
# 表现为 "Plugin [id: 'com.android.application', version: 'x.y.z'] was not found"。
# 现已从版本库移除；如本地确实需要代理，请通过以下任一方式配置，不要写回本文件：
#   1) 环境变量 GRADLE_OPTS / JAVA_OPTS
#   2) 用户级 ~/.gradle/gradle.properties（不进入仓库）
#   3) 命令行 -Dhttp.proxyHost=... -Dhttp.proxyPort=...

