name: melodyflow
description: "MelodyFlow - 开源跨平台音乐播放器，支持本地音乐、第三方音源、在线歌词与封面"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 音频播放 - media_kit 是当前最新的开源跨平台音频引擎，支持格式最全
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  media_kit_native_event_loop: ^1.0.8

  # 后台播放与音频焦点
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # 本地音乐扫描
  on_audio_query: ^2.9.0

  # 网络请求
  dio: ^5.7.0
  http: ^1.2.2

  # 状态管理
  provider: ^6.1.2

  # 图片与封面
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+4

  # 设备与包信息
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1

  # 路径与文件
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: ^8.1.4
  permission_handler: ^11.3.1

  # 持久化
  shared_preferences: ^2.3.3

  # 工具
  crypto: ^3.0.6
  convert: ^3.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/melodyflow_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF1A1A2E"
  adaptive_icon_foreground: "assets/icons/melodyflow_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/melodyflow_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
